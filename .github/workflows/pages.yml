name: Deploy invitation to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare invitation files
        env:
          TMAP_PUBLIC_APP_KEY: ${{ vars.TMAP_PUBLIC_APP_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
          WEDDING_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/generate_invitation.py --publish-dir _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
