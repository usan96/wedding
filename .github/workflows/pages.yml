name: Deploy invitation to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare invitation files
        run: |
          if grep -Eq 'data-draft|sample[.]png' index.html; then
            echo "::error::Update the draft with confirmed wedding details and a final photo before publishing."
            exit 1
          fi
          mkdir _site
          cp index.html styles.css invitation.js _site/
          if [ -d assets ]; then
            cp -R assets _site/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
